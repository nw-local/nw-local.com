<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1444" viewBox="0 0 1880 1444">
  <!--
    Fig. 2 for /blog/co2-enrichment-in-commercial-cannabis/, illustrating the
    "What too dry actually costs" paragraph (block p31b).

    Deliberately a diagram rather than a symptom photograph. Upward cupping is
    not specific to high VPD: heat and light stress produce the same shape, so a
    photorealistic leaf would read as a clinical reference a grower could
    pattern-match against and then dose or re-set a room on. The third band
    carries that caveat rather than leaving it to the caption.

    Every number here is the article's own. 1.3 to 1.4 kPa is the stated target,
    and about 1.5 kPa is what p31b computes for 62 percent at 84 °F (29 °C).
    The third panel carries no number because the article gives none; inventing
    one would put a fabricated setpoint in front of the reader.

    Body lines inside the panel cards are held to roughly 40 characters. The
    cards are 520 wide with 34 of padding each side, so a longer line runs out
    through the card border, and nothing in the build catches it: the figure is
    a raster upload by the time Astro sees it.
  -->
  <style>
    .fig    { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title  { font-size: 52px; font-weight: 700; fill: #1A1A1A; letter-spacing: -0.6px; }
    .deck   { font-size: 30px; fill: #545454; }
    .label  { font-size: 22px; font-weight: 700; letter-spacing: 1.7px; }
    .state  { font-size: 29px; font-weight: 700; fill: #1A1A1A; }
    .value  { font-size: 25px; font-weight: 700; }
    .note   { font-size: 23px; fill: #545454; }
    .stoma  { font-size: 21px; fill: #6E6E6E; letter-spacing: 0.4px; }
    .head   { font-size: 26px; font-weight: 700; fill: #1A1A1A; }
    .foot   { font-size: 23px; fill: #8E8E8E; }
    .brand  { font-size: 23px; font-weight: 700; fill: #6B2D8B; }
    .teal   { fill: #147868; }
    .red    { fill: #C0392B; }
    .rule   { stroke: #D5D5D6; stroke-width: 1.5; }
    .blade  { fill: none; stroke-width: 9; stroke-linecap: round; }
  </style>

  <rect width="1880" height="1444" fill="#F7F7F8"/>

  <g class="fig">
    <!-- Header -->
    <text class="title" x="80" y="118">What a room that drifted dry looks like</text>
    <text class="deck" x="80" y="176">Nothing about the humidity setpoint changed. The room warmed, VPD climbed past the target, and the canopy</text>
    <text class="deck" x="80" y="218">answered by folding its margins up, which shrinks the surface exposed to the gradient.</text>
    <line class="rule" x1="80" y1="272" x2="1800" y2="272"/>

    <text class="label teal" x="80" y="330">WHAT THE BLADE DOES AS VPD CLIMBS</text>

    <!-- Panel 1: on target -->
    <g>
      <rect x="80" y="360" width="520" height="476" rx="14" fill="#E6F2EE" stroke="#ABCFC4" stroke-width="1.5"/>
      <text class="state" x="114" y="410">At the target</text>
      <text class="value teal" x="114" y="450">1.3 to 1.4 kPa</text>
      <path class="blade" stroke="#147868" d="M 110 612 Q 225 620 340 622 Q 455 620 570 612"/>
      <circle cx="340" cy="622" r="9" fill="#147868"/>
      <g fill="#147868">
        <ellipse cx="241" cy="672" rx="4.5" ry="12"/><ellipse cx="259" cy="672" rx="4.5" ry="12"/>
        <ellipse cx="331" cy="672" rx="4.5" ry="12"/><ellipse cx="349" cy="672" rx="4.5" ry="12"/>
        <ellipse cx="421" cy="672" rx="4.5" ry="12"/><ellipse cx="439" cy="672" rx="4.5" ry="12"/>
      </g>
      <text class="stoma" x="114" y="716">STOMATA OPEN</text>
      <text class="note" x="114" y="752">The blade sits flat. Water leaves as</text>
      <text class="note" x="114" y="780">fast as the roots replace it, and the</text>
      <text class="note" x="114" y="808">gas keeps moving in.</text>
    </g>

    <!-- Panel 2: drifted -->
    <g>
      <rect x="680" y="360" width="520" height="476" rx="14" fill="#FDF0EE" stroke="#D5ADAE" stroke-width="1.5"/>
      <text class="state" x="714" y="410">The room drifted</text>
      <text class="value red" x="714" y="450">about 1.5 kPa</text>
      <path class="blade" stroke="#C0392B" d="M 710 551 Q 825 621 940 623 Q 1055 621 1170 551"/>
      <circle cx="940" cy="623" r="9" fill="#C0392B"/>
      <g fill="#C0392B">
        <ellipse cx="845" cy="673" rx="4.5" ry="12"/><ellipse cx="855" cy="673" rx="4.5" ry="12"/>
        <ellipse cx="935" cy="673" rx="4.5" ry="12"/><ellipse cx="945" cy="673" rx="4.5" ry="12"/>
        <ellipse cx="1025" cy="673" rx="4.5" ry="12"/><ellipse cx="1035" cy="673" rx="4.5" ry="12"/>
      </g>
      <text class="stoma" x="714" y="716">STOMATA CLOSING</text>
      <text class="note" x="714" y="752">62 percent at 84 °F (29 °C). The dial</text>
      <text class="note" x="714" y="780">never moved; the temperature moved</text>
      <text class="note" x="714" y="808">underneath it.</text>
    </g>

    <!-- Panel 3: overshoot held -->
    <g>
      <rect x="1280" y="360" width="520" height="476" rx="14" fill="#FDF0EE" stroke="#D5ADAE" stroke-width="1.5"/>
      <text class="state" x="1314" y="410">Overshoot held</text>
      <text class="value red" x="1314" y="450">further past the range</text>
      <path class="blade" stroke="#C0392B" d="M 1310 471 Q 1425 622 1540 624 Q 1655 622 1770 471"/>
      <circle cx="1540" cy="624" r="9" fill="#C0392B"/>
      <g fill="#C0392B">
        <ellipse cx="1447" cy="674" rx="4.5" ry="12"/><ellipse cx="1453" cy="674" rx="4.5" ry="12"/>
        <ellipse cx="1537" cy="674" rx="4.5" ry="12"/><ellipse cx="1543" cy="674" rx="4.5" ry="12"/>
        <ellipse cx="1627" cy="674" rx="4.5" ry="12"/><ellipse cx="1633" cy="674" rx="4.5" ry="12"/>
      </g>
      <text class="stoma" x="1314" y="716">STOMATA SHUT</text>
      <text class="note" x="1314" y="752">Margins curl hard, growth flattens,</text>
      <text class="note" x="1314" y="780">and irrigation demand climbs while</text>
      <text class="note" x="1314" y="808">the root zone falls behind.</text>
    </g>

    <!-- Mechanism band -->
    <text class="label teal" x="80" y="902">WHY THE BLADE FOLDS</text>

    <text class="head" x="80" y="948">Less surface to lose from</text>
    <text class="note" x="80" y="986">Cupping pulls the margins out of the moving</text>
    <text class="note" x="80" y="1016">air and cuts the area water can cross.</text>

    <text class="head" x="680" y="948">Stomata close, twice over</text>
    <text class="note" x="680" y="986">A gradient that steep shuts them, and</text>
    <text class="note" x="680" y="1016">enrichment has them part closed already.</text>

    <text class="head" x="1280" y="948">The carbon door shuts with them</text>
    <text class="note" x="1280" y="986">Closed stomata throttle CO₂ uptake, which</text>
    <text class="note" x="1280" y="1016">is the one thing the gas was bought to raise.</text>

    <!-- Differential band -->
    <text class="label red" x="80" y="1088">CUPPING ALONE DOES NOT NAME THE CAUSE</text>

    <rect x="80" y="1114" width="1720" height="168" rx="14" fill="#FDF0EE" stroke="#D5ADAE" stroke-width="1.5"/>

    <text class="head" x="118" y="1160">Points to VPD</text>
    <text class="note" x="118" y="1198">It shows up across the whole canopy and tracks a</text>
    <text class="note" x="118" y="1226">measured VPD above target. Read the leaf with an</text>
    <text class="note" x="118" y="1254">infrared thermometer, not the wall sensor.</text>

    <line class="rule" x1="940" y1="1144" x2="940" y2="1252" stroke="#D5ADAE"/>

    <text class="head" x="980" y="1160">Points to heat or light</text>
    <text class="note" x="980" y="1198">It concentrates under the hottest or closest</text>
    <text class="note" x="980" y="1226">fixtures while the rest of the canopy stays flat,</text>
    <text class="note" x="980" y="1254">and the room VPD reading sits inside the band.</text>

    <!-- Footer -->
    <line class="rule" x1="80" y1="1330" x2="1800" y2="1330"/>
    <text class="foot" x="80" y="1372">Schematic. Leaf outlines are illustrative and are not traced from photographs. Upward cupping is a general stress</text>
    <text class="foot" x="80" y="1406">response shared by heat and light stress, so read it alongside a measured canopy VPD rather than on its own.</text>
    <text class="brand" x="1800" y="1372" text-anchor="end">Northwest Local Cannabis</text>
  </g>
</svg>
