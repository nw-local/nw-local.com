<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1270" viewBox="0 0 1880 1270">
  <!-- Fig. 2 for /blog/dew-point-is-the-setpoint-vpd-by-stage/, in the
    "Disease sets the ceiling, not yield" section.

    The asymmetry between the two regions is deliberate and is the point
    of the figure. Botrytis has numeric bounds in Mahmoud et al. and gets
    a bounded box. Powdery mildew is described qualitatively in the
    cannabis work, so drawing it as a box would invent precision that
    does not exist. It gets an open band instead. -->
  <style>
    .fig    { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title  { font-size: 52px; font-weight: 700; fill: #1A1A1A; letter-spacing: -0.6px; }
    .deck   { font-size: 30px; fill: #545454; }
    .label  { font-size: 22px; font-weight: 700; letter-spacing: 1.7px; }
    .axis   { font-size: 24px; fill: #545454; }
    .axist  { font-size: 25px; font-weight: 700; fill: #1A1A1A; letter-spacing: 1.2px; }
    .note   { font-size: 26px; fill: #545454; }
    .noteb  { font-size: 26px; font-weight: 700; fill: #1A1A1A; }
    .foot   { font-size: 21px; fill: #8E8E8E; }
    .brand  { font-size: 23px; font-weight: 700; fill: #6B2D8B; }
    .rule   { stroke: #D5D5D6; stroke-width: 1.5; }
    .grid   { stroke: #E2E2E3; stroke-width: 1.2; }
    .axline { stroke: #9A9A9B; stroke-width: 2; }
    .curve  { fill: none; stroke-width: 5; stroke-linecap: round; }
  </style>
  <rect width="1880" height="1270" fill="#F7F7F8"/>
  <g class="fig">
    <text class="title" x="80" y="118">Temperature protects against one of these, not both</text>
    <text class="deck" x="80" y="176">The two pathogens on the same axes. Bud rot has published temperature and humidity bounds and is drawn with</text>
    <text class="deck" x="80" y="218">edges. Powdery mildew does not, in the cannabis literature we can find, so it is drawn as an open band: it tracks</text>
    <text class="deck" x="80" y="260">humidity at any temperature, which is why the ceiling never lifts.</text>
    <line class="rule" x1="80" y1="272" x2="1800" y2="272"/>
    <line class="grid" x1="230" y1="975.0" x2="1760" y2="975.0"/>
    <text class="axis" x="208" y="984.0" text-anchor="end">40%</text>
    <line class="grid" x1="230" y1="866.8" x2="1760" y2="866.8"/>
    <text class="axis" x="208" y="875.8" text-anchor="end">50%</text>
    <line class="grid" x1="230" y1="758.6" x2="1760" y2="758.6"/>
    <text class="axis" x="208" y="767.6" text-anchor="end">60%</text>
    <line class="grid" x1="230" y1="650.5" x2="1760" y2="650.5"/>
    <text class="axis" x="208" y="659.5" text-anchor="end">70%</text>
    <line class="grid" x1="230" y1="542.3" x2="1760" y2="542.3"/>
    <text class="axis" x="208" y="551.3" text-anchor="end">80%</text>
    <line class="grid" x1="230" y1="434.1" x2="1760" y2="434.1"/>
    <text class="axis" x="208" y="443.1" text-anchor="end">90%</text>
    <line class="grid" x1="230.0" y1="380" x2="230.0" y2="975"/>
    <text class="axis" x="230.0" y="1017" text-anchor="middle">55 °F</text>
    <line class="grid" x1="448.6" y1="380" x2="448.6" y2="975"/>
    <text class="axis" x="448.6" y="1017" text-anchor="middle">60 °F</text>
    <line class="grid" x1="667.1" y1="380" x2="667.1" y2="975"/>
    <text class="axis" x="667.1" y="1017" text-anchor="middle">65 °F</text>
    <line class="grid" x1="885.7" y1="380" x2="885.7" y2="975"/>
    <text class="axis" x="885.7" y="1017" text-anchor="middle">70 °F</text>
    <line class="grid" x1="1104.3" y1="380" x2="1104.3" y2="975"/>
    <text class="axis" x="1104.3" y="1017" text-anchor="middle">75 °F</text>
    <line class="grid" x1="1322.9" y1="380" x2="1322.9" y2="975"/>
    <text class="axis" x="1322.9" y="1017" text-anchor="middle">80 °F</text>
    <line class="grid" x1="1541.4" y1="380" x2="1541.4" y2="975"/>
    <text class="axis" x="1541.4" y="1017" text-anchor="middle">85 °F</text>
    <line class="grid" x1="1760.0" y1="380" x2="1760.0" y2="975"/>
    <text class="axis" x="1760.0" y="1017" text-anchor="middle">90 °F</text>
    <line class="axline" x1="230" y1="975" x2="1760" y2="975"/>
    <line class="axline" x1="230" y1="380" x2="230" y2="975"/>
    <text class="axist" x="995" y="1059" text-anchor="middle">TEMPERATURE</text>
    <text class="axist" x="100" y="678" text-anchor="middle" transform="rotate(-90 100 678)">RELATIVE HUMIDITY</text>
    <rect x="230" y="380.0" width="1530.0" height="324.5" fill="#6B2D8B" opacity="0.10"/>
    <text class="noteb" fill="#6B2D8B" x="256" y="677.5">POWDERY MILDEW: HUMIDITY ALONE, ANY TEMPERATURE</text>
    <rect x="579.7" y="380.0" width="524.6" height="270.5" fill="#FDF0EE" stroke="#D5ADAE" stroke-width="3"/>
    <text class="noteb" fill="#C0392B" x="842.0" y="477.4" text-anchor="middle">BUD ROT</text>
    <text class="note" x="842.0" y="531.5" text-anchor="middle">most destructive</text>
    <text class="note" x="842.0" y="585.5" text-anchor="middle">63 to 75 °F, above 70%</text>
    <rect x="579.7" y="726.2" width="655.7" height="32.5" fill="#147868" opacity="0.22" stroke="#147868" stroke-width="3"/>
    <text class="noteb" fill="#147868" x="907.6" y="812.7" text-anchor="middle">OUR NIGHTS, 60 to 63%</text>
    <rect x="1410.3" y="693.7" width="131.1" height="43.3" fill="#147868" opacity="0.22" stroke="#147868" stroke-width="3"/>
    <text class="noteb" fill="#147868" x="1475.9" y="563.9" text-anchor="middle">OUR ENRICHED DAY</text>
    <text class="note" x="1475.9" y="618.0" text-anchor="middle">past the bud rot window</text>
    <line x1="1104.3" y1="380" x2="1104.3" y2="975" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 8"/>
    <line class="rule" x1="80" y1="1128" x2="1800" y2="1128"/>
    <text class="foot" x="80" y="1166">Bud rot bounds: Mahmoud, M. et al. (2023), Understanding bud rot development caused by Botrytis cinerea on greenhouse cannabis, Botany 101(7), 200-231.</text>
    <text class="foot" x="80" y="1194">Powdery mildew is described qualitatively in that literature, so no temperature bound is drawn. The band's lower edge is our operating ceiling, not a threshold.</text>
    <text class="brand" x="1800" y="1240" text-anchor="end">Northwest Local Cannabis</text>
  </g>
</svg>