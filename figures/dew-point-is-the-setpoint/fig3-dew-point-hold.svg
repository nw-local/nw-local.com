<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1270" viewBox="0 0 1880 1270">
  <!-- Fig. 3 for /blog/dew-point-is-the-setpoint-vpd-by-stage/, in the
    "Why dew point is the setpoint you hold" section. The three marked
    rooms are the same air; only the thermometer changed. -->
  <style>
    .fig    { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title  { font-size: 52px; font-weight: 700; fill: #1A1A1A; letter-spacing: -0.6px; }
    .deck   { font-size: 30px; fill: #545454; }
    .label  { font-size: 22px; font-weight: 700; letter-spacing: 1.7px; }
    .axis   { font-size: 24px; fill: #545454; }
    .axist  { font-size: 25px; font-weight: 700; fill: #1A1A1A; letter-spacing: 1.2px; }
    .note   { font-size: 26px; fill: #545454; }
    .noteb  { font-size: 26px; font-weight: 700; fill: #1A1A1A; }
    .foot   { font-size: 21px; fill: #8E8E8E; }
    .brand  { font-size: 23px; font-weight: 700; fill: #6B2D8B; }
    .rule   { stroke: #D5D5D6; stroke-width: 1.5; }
    .grid   { stroke: #E2E2E3; stroke-width: 1.2; }
    .axline { stroke: #9A9A9B; stroke-width: 2; }
    .curve  { fill: none; stroke-width: 5; stroke-linecap: round; }
  </style>
  <rect width="1880" height="1270" fill="#F7F7F8"/>
  <g class="fig">
    <text class="title" x="80" y="118">Dew point holds still while relative humidity moves under it</text>
    <text class="deck" x="80" y="176">One quantity of water in the air, described two ways. Hold the dew point at 55 °F (13 °C) and the humidity reading</text>
    <text class="deck" x="80" y="218">climbs from 45 percent to 75 percent as the room cools from 78 °F to 63 °F, without a drop of water being added.</text>
    <text class="deck" x="80" y="260">That is why a humidity alarm means something different at every hour of the dark period and a dew point alarm does not.</text>
    <line class="rule" x1="80" y1="272" x2="1800" y2="272"/>
    <line class="grid" x1="230" y1="975.0" x2="1760" y2="975.0"/>
    <text class="axis" x="208" y="984.0" text-anchor="end">30%</text>
    <line class="grid" x1="230" y1="890.0" x2="1760" y2="890.0"/>
    <text class="axis" x="208" y="899.0" text-anchor="end">40%</text>
    <line class="grid" x1="230" y1="805.0" x2="1760" y2="805.0"/>
    <text class="axis" x="208" y="814.0" text-anchor="end">50%</text>
    <line class="grid" x1="230" y1="720.0" x2="1760" y2="720.0"/>
    <text class="axis" x="208" y="729.0" text-anchor="end">60%</text>
    <line class="grid" x1="230" y1="635.0" x2="1760" y2="635.0"/>
    <text class="axis" x="208" y="644.0" text-anchor="end">70%</text>
    <line class="grid" x1="230" y1="550.0" x2="1760" y2="550.0"/>
    <text class="axis" x="208" y="559.0" text-anchor="end">80%</text>
    <line class="grid" x1="230" y1="465.0" x2="1760" y2="465.0"/>
    <text class="axis" x="208" y="474.0" text-anchor="end">90%</text>
    <line class="grid" x1="230" y1="380.0" x2="1760" y2="380.0"/>
    <text class="axis" x="208" y="389.0" text-anchor="end">100%</text>
    <line class="grid" x1="230.0" y1="380" x2="230.0" y2="975"/>
    <text class="axis" x="230.0" y="1017" text-anchor="middle">50 °F</text>
    <line class="grid" x1="448.6" y1="380" x2="448.6" y2="975"/>
    <text class="axis" x="448.6" y="1017" text-anchor="middle">55 °F</text>
    <line class="grid" x1="667.1" y1="380" x2="667.1" y2="975"/>
    <text class="axis" x="667.1" y="1017" text-anchor="middle">60 °F</text>
    <line class="grid" x1="885.7" y1="380" x2="885.7" y2="975"/>
    <text class="axis" x="885.7" y="1017" text-anchor="middle">65 °F</text>
    <line class="grid" x1="1104.3" y1="380" x2="1104.3" y2="975"/>
    <text class="axis" x="1104.3" y="1017" text-anchor="middle">70 °F</text>
    <line class="grid" x1="1322.9" y1="380" x2="1322.9" y2="975"/>
    <text class="axis" x="1322.9" y="1017" text-anchor="middle">75 °F</text>
    <line class="grid" x1="1541.4" y1="380" x2="1541.4" y2="975"/>
    <text class="axis" x="1541.4" y="1017" text-anchor="middle">80 °F</text>
    <line class="grid" x1="1760.0" y1="380" x2="1760.0" y2="975"/>
    <text class="axis" x="1760.0" y="1017" text-anchor="middle">85 °F</text>
    <line class="axline" x1="230" y1="975" x2="1760" y2="975"/>
    <line class="axline" x1="230" y1="380" x2="230" y2="975"/>
    <text class="axist" x="995" y="1059" text-anchor="middle">ROOM TEMPERATURE</text>
    <text class="axist" x="100" y="678" text-anchor="middle" transform="rotate(-90 100 678)">RELATIVE HUMIDITY</text>
    <polyline class="curve" stroke="#2D6FA8" points="448.6,380.0 459.5,387.7 470.4,395.3 481.4,402.8 492.3,410.3 503.2,417.7 514.1,425.0 525.1,432.2 536.0,439.4 546.9,446.5 557.9,453.5 568.8,460.4 579.7,467.3 590.6,474.1 601.6,480.9 612.5,487.5 623.4,494.1 634.4,500.7 645.3,507.2 656.2,513.6 667.1,519.9 678.1,526.2 689.0,532.4 699.9,538.6 710.9,544.7 721.8,550.7 732.7,556.7 743.6,562.6 754.6,568.5 765.5,574.3 776.4,580.1 787.4,585.8 798.3,591.4 809.2,597.0 820.1,602.5 831.1,608.0 842.0,613.4 852.9,618.8 863.9,624.1 874.8,629.3 885.7,634.5 896.6,639.7 907.6,644.8 918.5,649.9 929.4,654.9 940.4,659.9 951.3,664.8 962.2,669.6 973.1,674.5 984.1,679.2 995.0,684.0 1005.9,688.6 1016.9,693.3 1027.8,697.9 1038.7,702.4 1049.6,706.9 1060.6,711.4 1071.5,715.8 1082.4,720.2 1093.4,724.5 1104.3,728.8 1115.2,733.1 1126.1,737.3 1137.1,741.4 1148.0,745.6 1158.9,749.7 1169.9,753.7 1180.8,757.7 1191.7,761.7 1202.6,765.7 1213.6,769.6 1224.5,773.4 1235.4,777.3 1246.4,781.1 1257.3,784.8 1268.2,788.5 1279.1,792.2 1290.1,795.9 1301.0,799.5 1311.9,803.1 1322.9,806.6 1333.8,810.2 1344.7,813.6 1355.6,817.1 1366.6,820.5 1377.5,823.9 1388.4,827.3 1399.4,830.6 1410.3,833.9 1421.2,837.1 1432.1,840.4 1443.1,843.6 1454.0,846.8 1464.9,849.9 1475.9,853.0 1486.8,856.1 1497.7,859.2 1508.6,862.2 1519.6,865.2 1530.5,868.2 1541.4,871.1 1552.4,874.1 1563.3,877.0 1574.2,879.8 1585.1,882.7 1596.1,885.5 1607.0,888.3 1617.9,891.0 1628.9,893.8 1639.8,896.5 1650.7,899.2 1661.6,901.8 1672.6,904.5 1683.5,907.1 1694.4,909.7 1705.4,912.3 1716.3,914.8 1727.2,917.3 1738.1,919.8 1749.1,922.3 1760.0,924.8"/>
    <line x1="448.6" y1="380" x2="448.6" y2="975" stroke="#C0392B" stroke-width="4" stroke-dasharray="10 8"/>
    <text class="noteb" fill="#C0392B" x="466.6" y="414.0">ANY SURFACE AT OR BELOW 55 °F (13 °C) IS WET</text>
    <circle cx="798.3" cy="591.4" r="12" fill="#F7F7F8" stroke="#2D6FA8" stroke-width="5"/>
    <text class="noteb" x="798.3" y="557.4" text-anchor="middle">63 °F reads 75%</text>
    <circle cx="1104.3" cy="728.8" r="12" fill="#F7F7F8" stroke="#2D6FA8" stroke-width="5"/>
    <text class="noteb" x="1104.3" y="694.8" text-anchor="middle">70 °F reads 59%</text>
    <circle cx="1454.0" cy="846.8" r="12" fill="#F7F7F8" stroke="#2D6FA8" stroke-width="5"/>
    <text class="noteb" x="1454.0" y="812.8" text-anchor="middle">78 °F reads 45%</text>
    <text class="noteb" fill="#2D6FA8" x="260" y="881.5">One dew point of 55 °F (13 °C), held all night</text>
    <text class="note" x="260" y="932.5">The humidity reading changes. The water in the room does not.</text>
    <line class="rule" x1="80" y1="1128" x2="1800" y2="1128"/>
    <text class="foot" x="80" y="1166">Computed from the Magnus equation. Relative humidity at a given dew point is SVP(dew point) / SVP(room temperature).</text>
    <text class="foot" x="80" y="1194">The dashed line is saturation: any surface sitting at or below the dew point has condensation on it, whatever the room average reads.</text>
    <text class="brand" x="1800" y="1240" text-anchor="end">Northwest Local Cannabis</text>
  </g>
</svg>