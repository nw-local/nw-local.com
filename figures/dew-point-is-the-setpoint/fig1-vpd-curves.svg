    <polyline class="curve" stroke="#6B2D8B" points="230.0,846.6 260.6,836.9 291.2,827.3 321.8,817.9 352.4,808.7 383.0,799.7 413.6,790.8 444.2,782.1 474.8,773.6 505.4,765.2 536.0,757.0 566.6,749.0 597.2,741.1 627.8,733.4 658.4,725.8 689.0,718.3 719.6,711.0 750.2,703.8 780.8,696.8 811.4,689.9 842.0,683.1 872.6,676.4 903.2,669.9 933.8,663.5 964.4,657.2 995.0,651.0 1025.6,645.0 1056.2,639.0 1086.8,633.2 1117.4,627.4 1148.0,621.8 1178.6,616.3 1209.2,610.9 1239.8,605.5 1270.4,600.3 1301.0,595.2 1331.6,590.1 1362.2,585.2 1392.8,580.3 1423.4,575.5 1454.0,570.8 1484.6,566.2 1515.2,561.7 1545.8,557.3 1576.4,552.9 1607.0,548.6 1637.6,544.4 1668.2,540.3 1698.8,536.2 1729.4,532.2 1760.0,528.3"/>
    <text class="noteb" fill="#6B2D8B" x="1774" y="537.3">1.2 kPa</text>
