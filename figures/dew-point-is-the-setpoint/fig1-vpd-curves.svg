    <text class="noteb" fill="#C0392B" x="1774" y="578.5">1.4 kPa</text>
    <circle cx="964.4" cy="719.9" r="11" fill="#F7F7F8" stroke="#C0392B" stroke-width="5"/>
    <circle cx="1392.8" cy="630.2" r="11" fill="#F7F7F8" stroke="#C0392B" stroke-width="5"/>
    <text class="note" x="964.4" y="771.9" text-anchor="middle">77 °F needs 56%</text>
    <text class="note" x="1392.8" y="682.2" text-anchor="middle">84 °F needs 65%</text>
    <line class="rule" x1="80" y1="1128" x2="1800" y2="1128"/>
    <text class="foot" x="80" y="1166">Computed from the Magnus equation, SVP = 0.61094 x exp(17.625 x T / (T + 243.04)), with T in °C, then RH = 1 - (VPD / SVP).</text>
    <text class="foot" x="80" y="1194">Marked points are the two canopy temperatures compared in the CO2 enrichment post: holding 1.4 kPa needs 9 more points of humidity at 84 °F than at 77 °F.</text>
    <text class="brand" x="1800" y="1240" text-anchor="end">Northwest Local Cannabis</text>
  </g>
</svg>