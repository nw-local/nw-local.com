<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1270" viewBox="0 0 1880 1270">
  <!-- Fig. 1 for /blog/dew-point-is-the-setpoint-vpd-by-stage/, in the
    "VPD is a derived number" section. Curves computed, not drawn:
    every point comes from scripts/psychrometrics.py, so the figure
    cannot drift from the table beside it. -->
  <style>
    .fig    { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title  { font-size: 52px; font-weight: 700; fill: #1A1A1A; letter-spacing: -0.6px; }
    .deck   { font-size: 30px; fill: #545454; }
    .label  { font-size: 22px; font-weight: 700; letter-spacing: 1.7px; }
    .axis   { font-size: 24px; fill: #545454; }
    .axist  { font-size: 25px; font-weight: 700; fill: #1A1A1A; letter-spacing: 1.2px; }
    .note   { font-size: 26px; fill: #545454; }
    .noteb  { font-size: 26px; font-weight: 700; fill: #1A1A1A; }
    .foot   { font-size: 21px; fill: #8E8E8E; }
    .brand  { font-size: 23px; font-weight: 700; fill: #6B2D8B; }
    .rule   { stroke: #D5D5D6; stroke-width: 1.5; }
    .grid   { stroke: #E2E2E3; stroke-width: 1.2; }
    .axline { stroke: #9A9A9B; stroke-width: 2; }
    .curve  { fill: none; stroke-width: 5; stroke-linecap: round; }
  </style>
  <rect width="1880" height="1270" fill="#F7F7F8"/>
  <g class="fig">
    <text class="title" x="80" y="118">The same VPD target is a different humidity at every temperature</text>
    <text class="deck" x="80" y="176">Relative humidity required to hold each VPD target, plotted against canopy temperature. The lines curve because</text>
    <text class="deck" x="80" y="218">saturation vapor pressure grows exponentially with heat, so a room that warms up while holding its old humidity</text>
    <text class="deck" x="80" y="260">setpoint has moved to a much drier VPD without anyone touching the target.</text>
    <line class="rule" x1="80" y1="272" x2="1800" y2="272"/>
    <line class="grid" x1="230" y1="975.0" x2="1760" y2="975.0"/>
    <text class="axis" x="208" y="984.0" text-anchor="end">30%</text>
    <line class="grid" x1="230" y1="875.8" x2="1760" y2="875.8"/>
    <text class="axis" x="208" y="884.8" text-anchor="end">40%</text>
    <line class="grid" x1="230" y1="776.7" x2="1760" y2="776.7"/>
    <text class="axis" x="208" y="785.7" text-anchor="end">50%</text>
    <line class="grid" x1="230" y1="677.5" x2="1760" y2="677.5"/>
    <text class="axis" x="208" y="686.5" text-anchor="end">60%</text>
    <line class="grid" x1="230" y1="578.3" x2="1760" y2="578.3"/>
    <text class="axis" x="208" y="587.3" text-anchor="end">70%</text>
    <line class="grid" x1="230" y1="479.2" x2="1760" y2="479.2"/>
    <text class="axis" x="208" y="488.2" text-anchor="end">80%</text>
    <line class="grid" x1="230" y1="380.0" x2="1760" y2="380.0"/>
    <text class="axis" x="208" y="389.0" text-anchor="end">90%</text>
    <line class="grid" x1="230.0" y1="380" x2="230.0" y2="975"/>
    <text class="axis" x="230.0" y="1017" text-anchor="middle">65 °F</text>
    <line class="grid" x1="536.0" y1="380" x2="536.0" y2="975"/>
    <text class="axis" x="536.0" y="1017" text-anchor="middle">70 °F</text>
    <line class="grid" x1="842.0" y1="380" x2="842.0" y2="975"/>
    <text class="axis" x="842.0" y="1017" text-anchor="middle">75 °F</text>
    <line class="grid" x1="1148.0" y1="380" x2="1148.0" y2="975"/>
    <text class="axis" x="1148.0" y="1017" text-anchor="middle">80 °F</text>
    <line class="grid" x1="1454.0" y1="380" x2="1454.0" y2="975"/>
    <text class="axis" x="1454.0" y="1017" text-anchor="middle">85 °F</text>
    <line class="grid" x1="1760.0" y1="380" x2="1760.0" y2="975"/>
    <text class="axis" x="1760.0" y="1017" text-anchor="middle">90 °F</text>
    <line class="axline" x1="230" y1="975" x2="1760" y2="975"/>
    <line class="axline" x1="230" y1="380" x2="230" y2="975"/>
    <text class="axist" x="995" y="1059" text-anchor="middle">CANOPY TEMPERATURE</text>
    <text class="axist" x="100" y="678" text-anchor="middle" transform="rotate(-90 100 678)">RELATIVE HUMIDITY</text>
