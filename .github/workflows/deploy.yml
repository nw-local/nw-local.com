name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-content-update]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages permits exactly one deployment at a time, and this workflow has
# three triggers that routinely fire at once. Sanity's webhook sends one
# workflow_dispatch per *published document*, so a content batch of N documents
# queues N builds that all rebuild main against the same dataset. Any push to
# main landing in that window loses the race and fails with "Deployment request
# failed ... due to in progress deployment" — a red run that a later green one
# silently supersedes, on a workflow nobody watches. Seen 2026-08-12: a
# 22-document glossary publish collided with a push (run 31576537317).
#
# cancel-in-progress is deliberately false, matching GitHub's own Pages
# guidance: a queued run is superseded by a newer one, but a deployment already
# in flight is allowed to finish rather than being interrupted mid-publish.
# That still collapses the storm, since every queued run would build the same
# thing anyway.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v6
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      # The content-style check is here rather than only in audit.yml:
      # audit.yml runs on pull_request and on
      # the nightly cron, but content reaches production through a third path
      # that touches neither — Sanity's webhook fires workflow_dispatch here on
      # every publish. So every dist-validating check guarded code changes and
      # skipped the content it was written for. A British spelling or a lone
      # Celsius figure could go live and stay live until the next nightly run
      # happened to fail, on a workflow nobody watches.
      #
      # This runs against the dist/ the action above just built: withastro's
      # build runs in the checked-out workspace and upload-pages-artifact
      # copies rather than moves, so the directory is still on disk. Failing
      # this step fails the build job, which skips the deploy job below, which
      # leaves the previously deployed site live. Fail-closed is deliberate:
      # the visible symptom is that published content does not appear, which
      # beats bad copy going out silently.
      #
      # Deliberately not the other audit checks. robots and the analytics
      # snippet can only be broken by a code change, which always goes through
      # a pull request and is already covered there. This is one of the checks
      # a content publish can break on its own.
      - name: Check US spelling and paired temperature units
        run: ./scripts/check-content-style.py dist

      # Contact fields can change through Sanity without a pull request. Keep
      # the public sales address on business surfaces and the personal address
      # confined to its explicitly authored profile.
      - name: Check business and personal email routing
        run: ./scripts/check-email-routing.py dist

      # Unlike source checks, this contract can be broken by a Sanity publish
      # with no pull request. Fail this build before GitHub Pages receives the
      # artifact, keeping the previous deployment live.
      - name: Check glossary build contracts
        run: ./scripts/check-glossary-build.py dist

      # Same reasoning as the glossary check above: drop.coas, strain.lineage
      # and drop.gallery all change through Sanity with no pull request.
      - name: Check drop build contracts
        run: ./scripts/check-drop-build.py dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
