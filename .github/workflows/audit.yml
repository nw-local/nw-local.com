name: Audit (reusable)

on:
  workflow_call:
    inputs:
      check-external-links:
        description: >-
          Verify links to third-party sites as well as internal ones. Off for
          pull requests: an unrelated PR should not fail because someone
          else's site is slow. The nightly run against main turns it on, so a
          genuinely dead external link still fails loudly — just not in a
          contributor's way.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  validate-sitemap:
    name: Validate sitemap
    runs-on: ubuntu-latest
    needs: build
    steps:
      # checkout must precede download-artifact: it cleans the workspace, so
      # doing it second would delete the dist/ the later steps assert against.
      # It is needed at all because this job now runs a repo script.
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Check sitemap exists, is valid XML, and lists URLs
        run: |
          test -f dist/sitemap-index.xml || { echo "sitemap-index.xml missing"; exit 1; }
          xmllint --noout dist/sitemap-index.xml
          if [ -f dist/sitemap-0.xml ]; then
            xmllint --noout dist/sitemap-0.xml
            grep -q '<loc>' dist/sitemap-0.xml || { echo "sitemap-0.xml has no <loc> entries"; exit 1; }
          fi
          echo "Sitemap structure valid"
      # Extracted to a script rather than inlined here, matching
      # check-nightly-freshness.sh and check-analytics-snippet.sh: logic that
      # lives in YAML can only be exercised by pushing a commit, and this check
      # shipped with a `grep -om1` bug that made it fail on correct input while
      # passing its own mismatch case vacuously. Running it locally caught that.
      - name: Check robots.txt exists and points at this build's sitemap
        run: ./scripts/check-robots.sh dist

  validate-analytics:
    name: Validate analytics snippet
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      # Runs on pull requests as well as the nightly, unlike nightly-freshness:
      # this failure IS caused by the contributor's diff and IS fixable in it,
      # which is precisely the case where failing the PR is the useful thing to
      # do. The regression it guards against was introduced by an unrelated
      # formatting pass, so the check has to sit where such a pass gets reviewed.
      - name: Check the GA snippet can actually record hits
        run: ./scripts/check-analytics-snippet.sh dist
      # No secrets: the check reads the built HTML and asserts on the snippet's
      # shape, never on the measurement id's value.

  validate-content-style:
    name: Validate content style
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      # Content style drifts silently and is caught, if at all, by a human
      # noticing one word. Both rules it enforces reached published pages that
      # way: a British spelling paraphrased out of a paper, and a temperature
      # given only in Celsius. Nothing else in CI reads the prose.
      #
      # Runs on pull requests as well as the nightly for the same reason as
      # validate-analytics: the failure is caused by the contributor's diff and
      # is fixable in it. It also runs on the nightly, which matters more here
      # than for most checks, because publishing in Sanity changes the content
      # without any diff at all.
      - name: Check US spelling and paired temperature units
        run: ./scripts/check-content-style.py dist

  validate-links:
    name: Check links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      # --offline resolves every root-relative link against the built output and
      # skips the network entirely, so this is deterministic: it fails only when a
      # link in this repo is genuinely broken.
      - name: Check internal links
        if: ${{ !inputs.check-external-links }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir "${{ github.workspace }}/dist" --no-progress --max-concurrency 8 'dist/**/*.html'
          fail: true

      # Two exclusions, for different reasons:
      #
      # nw-local.com — every page carries a self-referencing <link rel="canonical">
      # pointing at production, which cannot resolve until after the PR that
      # introduces the page has merged.
      #
      # relentless-genetics.com — reachable and fast from a normal network (HEAD
      # returns 200 in ~0.3s, with or without a browser user-agent) but times out
      # from GitHub-hosted runners, so its CDN appears to filter datacenter
      # traffic. Not a broken link, and not verifiable from CI at all — leaving it
      # in would fail the nightly run every night and train us to ignore it.
      - name: Check internal and external links
        if: ${{ inputs.check-external-links }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir "${{ github.workspace }}/dist" --accept 200,202,301,302,403,429 --exclude '^https?://(www\.)?nw-local\.com' --exclude '^https?://(www\.)?relentless-genetics\.com' --no-progress --max-concurrency 8 'dist/**/*.html'
          fail: true

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20"
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
