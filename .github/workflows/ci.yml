name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn astro check
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

  drop-lookup:
    name: Drop lookup rule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20"
          cache: yarn
      # No yarn install: the script imports one dependency-free module and runs
      # under node's built-in type stripping.
      - name: Check the buildDropLookup collision rule
        run: node scripts/check-drop-lookup.ts

      # No yarn install: the glossary checks import dependency-free modules and
      # run under node's built-in type stripping.
      - name: Check glossary content contracts and search mechanics
        run: node scripts/check-glossary.ts

      - name: Check glossary progressive-enhancement behavior
        run: node scripts/check-glossary-browser.ts

      - name: Check author profile structured data
        run: node scripts/check-person-jsonld.ts

      - name: Check Portable Text glossary heading preparation
        run: node scripts/check-portable-text-headings.ts

      # psychrometrics.py computes figures that end up in published prose, so
      # its constants are pinned against values already in the CO2 post. Pure
      # arithmetic, no artifact, no build.
      - name: Test the psychrometric helpers
        run: ./scripts/test-psychrometrics.py

      - name: Check the top and footer navigation structure
        run: make check-navigation

  # studio/ is a separate project with its own package manager, its own ESLint
  # config, and its own Prettier config, and the root's tooling explicitly
  # ignores it. Nothing verified it until this job existed, which is how the
  # Prettier config drifted away from every file it was supposed to govern.
  # No secrets: the Studio does not read the site's build-time env vars.
  studio:
    name: Studio checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.20"
          cache: yarn
          cache-dependency-path: studio/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: studio
      - run: yarn lint
        working-directory: studio
      - run: yarn typecheck
        working-directory: studio
      - run: yarn format:check
        working-directory: studio

  audit:
    name: Audit
    uses: ./.github/workflows/audit.yml
    secrets: inherit

  nightly-freshness:
    name: Nightly freshness
    # Pushes to main only. A stale nightly is repo-wide infrastructure breakage
    # that a contributor's PR neither caused nor can fix; failing their PR on it
    # would repeat the problem #25 solved by moving external-link checks off
    # pull requests. Failing here still reddens main and triggers GitHub's
    # failure email.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block rather than merging
    # with it, so contents: read must be restated or actions/checkout loses access.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Check the nightly cron is still firing
        run: ./scripts/check-nightly-freshness.sh
        env:
          GH_TOKEN: ${{ github.token }}
